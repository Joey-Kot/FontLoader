name: Build Latest Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  build:
    name: Font Loader (windows-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: font-loader-${{ matrix.target }}

      - name: Build Font Loader
        run: cargo build --release --locked --target ${{ matrix.target }} --bin FontLoader

      - name: Package executable and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "FontLoader-windows-${{ matrix.arch }}"
          $packageRoot = Join-Path $env:RUNNER_TEMP "font-loader-package"
          $stage = Join-Path $packageRoot $base
          $output = Join-Path $env:GITHUB_WORKSPACE "release-output"
          $archive = Join-Path $output "${base}.zip"

          New-Item -ItemType Directory -Force -Path $stage, $output
          Copy-Item "target/${{ matrix.target }}/release/FontLoader.exe" (Join-Path $stage "FontLoader.exe")
          Copy-Item README.md, LICENSE, NOTICE $stage
          Compress-Archive -Path $stage -DestinationPath $archive -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "${archive}.sha256",
            "${hash}  ${base}.zip`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-font-loader-windows-${{ matrix.arch }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Replace Latest release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Verify checksums and create aggregate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check ./*.sha256
          sha256sum ./*.zip | sed 's#  \./#  #' > SHA256SUMS

      - name: Replace Latest tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view Latest; then
            gh release delete Latest --cleanup-tag --yes
          fi

          git tag --force Latest "${GITHUB_SHA}"
          git push origin refs/tags/Latest --force

          gh release create Latest release-assets/* \
            --verify-tag \
            --title "Latest" \
            --notes "Automated rolling build from commit ${GITHUB_SHA}. Includes Windows x86_64 and ARM64 Font Loader packages. Every archive has a matching SHA-256 sidecar; SHA256SUMS contains the aggregate checksums." \
            --latest
