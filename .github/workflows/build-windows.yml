name: Build Windows

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: font-loader-${{ matrix.target }}

      - name: Build Font Loader
        run: cargo build --release --locked --target ${{ matrix.target }} --bin FontLoader

      - name: Package executable and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "FontLoader-windows-${{ matrix.arch }}"
          $packageRoot = Join-Path $env:RUNNER_TEMP "font-loader-package"
          $stage = Join-Path $packageRoot $base
          $output = Join-Path $env:GITHUB_WORKSPACE "release-output"
          $archive = Join-Path $output "${base}.zip"

          New-Item -ItemType Directory -Force -Path $stage, $output
          Copy-Item "target/${{ matrix.target }}/release/FontLoader.exe" (Join-Path $stage "FontLoader.exe")
          Copy-Item README.md, LICENSE, NOTICE $stage
          Compress-Archive -Path $stage -DestinationPath $archive -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "${archive}.sha256",
            "${hash}  ${base}.zip`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: FontLoader-windows-${{ matrix.arch }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 1
